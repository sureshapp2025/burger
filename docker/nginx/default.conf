server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/web;
    index index.php;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size for file uploads
    client_max_body_size 64M;

    # Prevent logging of missing common static assets
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Drupal clean URLs and front-controller router pattern
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Directives for private files (Drupal security best practice)
    location ~ ^/sites/[^/]+/files/private/ {
        return 403;
    }

    # Process PHP requests via PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Buffer tweaks for Drupal large headers
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block access to any PHP files inside the files directory
    location ~ ^/sites/[^/]+/files/.*\.php$ {
        deny all;
    }

    # Cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    error_log /var/log/nginx/error.log error;
    access_log /var/log/nginx/access.log;
}
