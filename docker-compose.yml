version: '3.8'

services:
  # Nginx Web Server Service
  web:
    image: nginx:stable-alpine
    container_name: drupal_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - drupal_network

  # PHP-FPM Application Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: drupal_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      IS_DOCKER_PROJECT: "true"
      DB_HOST: db
      DB_PORT_INTERNAL: 3306
      DB_NAME: ${DB_NAME:-drupal}
      DB_USER: ${DB_USER:-drupal_user}
      DB_PASSWORD: ${DB_PASSWORD:-drupal_secure_password}
    depends_on:
      - db
    networks:
      - drupal_network

  # MariaDB Database Service
  db:
    image: mariadb:10.11
    container_name: drupal_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-drupal}
      MYSQL_USER: ${DB_USER:-drupal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-drupal}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - drupal_network

volumes:
  db_data:
    driver: local

networks:
  drupal_network:
    driver: bridge
